name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy all web files
        run: |
          mkdir -p www
          shopt -s dotglob
          for f in *; do
            case "$f" in
              .git|.github|resources|www) ;;
              *) cp -r "$f" www/ ;;
            esac
          done

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "Thought Flare" com.jnab.thoughtflare --web-dir=www
          npx cap add android

      - name: Generate app icon
        run: |
          if [ -f resources/icon.png ]; then
            npx @capacitor/assets generate --android
          fi

      - name: Sync web files into app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
